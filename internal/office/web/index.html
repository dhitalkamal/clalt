<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>clalt office</title>
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="editor.css">
<link rel="stylesheet" href="chrome.css">
<link rel="stylesheet" href="activity.css">
<link rel="stylesheet" href="reviews.css">
<link rel="stylesheet" href="actions.css">
<link rel="stylesheet" href="summary.css">
</head>
<body>
<canvas id="c"></canvas>
<div id="labels"></div>
<div id="status"></div>
<div id="notice" hidden></div>
<nav id="bar" aria-label="camera" hidden></nav>
<div id="controls">
  <button id="b-lines" title="dotted lines from subagents to their main agent">Team lines</button>
  <button id="b-tags" title="always show every tag">Tags</button>
  <button id="b-today" title="what each account did on a day, and the usage history">Today</button>
  <button id="b-reviews" title="pull request reviews" hidden>Reviews <span class="badge" hidden></span></button>
  <button id="b-settings" title="default office and build mode"><svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true" focusable="false"><path fill="currentColor" d="M19.4 13a7.7 7.7 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.4 7.4 0 0 0-1.7-1l-.4-2.7h-4l-.4 2.7a7.4 7.4 0 0 0-1.7 1l-2.5-1-2 3.5L4.6 11a7.7 7.7 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1a7.4 7.4 0 0 0 1.7 1l.4 2.7h4l.4-2.7a7.4 7.4 0 0 0 1.7-1l2.5 1 2-3.5zM12 15.5A3.5 3.5 0 1 1 12 8.5a3.5 3.5 0 0 1 0 7z"/></svg> Settings</button>
  <button id="b-home" title="back to the overview (Esc)">Overview</button>
</div>
<div class="hint"><span id="hint-text">drag rotate, shift-drag move, wheel zoom, WASD move, G ground, Esc top</span> <a href="CREDITS.txt" target="_blank" rel="noopener">credits</a></div>
<div id="card" hidden></div>
<div id="empty" hidden><div><p>No sessions running</p><small>start one with clalt run, it shows up here</small></div></div>
<div id="loading"><span>loading office</span><div id="loadtrack"><div id="loadbar"></div></div></div>
<script type="importmap">
{ "imports": { "three": "./vendor/three/three.module.min.js", "three/addons/": "./vendor/three/examples/jsm/" } }
</script>
<script type="module" src="js/main.js"></script>
</body>
</html>
