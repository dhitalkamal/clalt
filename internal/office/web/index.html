<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>clalt office</title>
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="editor.css">
</head>
<body>
<canvas id="c"></canvas>
<div id="labels"></div>
<div id="status"></div>
<div id="notice" hidden></div>
<div id="controls">
  <button id="b-lines" title="dotted lines from subagents to their main agent">Team lines</button>
  <button id="b-tags" title="always show every tag">Tags</button>
  <button id="b-build" hidden title="edit the floor plan (B)">Build</button>
  <button id="b-top">Top view</button>
  <button id="b-front">Front view</button>
  <button id="b-home" title="back to the overview (Esc)">Overview</button>
</div>
<div class="hint">drag to orbit, right-drag to pan, wheel to zoom, Esc resets <a href="CREDITS.txt" target="_blank" rel="noopener">credits</a></div>
<div id="card" hidden></div>
<div id="empty" hidden><div><p>No sessions running</p><small>start one with clalt run, it shows up here</small></div></div>
<div id="loading"><span>loading office</span><div id="loadtrack"><div id="loadbar"></div></div></div>
<script type="importmap">
{ "imports": { "three": "./vendor/three/three.module.min.js", "three/addons/": "./vendor/three/examples/jsm/" } }
</script>
<script type="module" src="js/main.js"></script>
</body>
</html>
