name: ci

on:
  pull_request:
  push:
    branches: [develop, main]
  schedule:
    # weekly govulncheck, catches new advisories against unchanged code
    - cron: '0 3 * * 1'

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # windows is informational until its tests are portable: it may fail
    # without failing the run. ubuntu and macos stay blocking.
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    # backstop for the known windows hang (360 is the github default)
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 15 || 360 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: gofmt
        if: matrix.os == 'ubuntu-latest'
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "unformatted:"; echo "$out"; exit 1; fi
      - name: vet
        run: go vet ./...
      # -race needs cgo; windows runners don't reliably have a c compiler for
      # it, so windows falls back to a plain (non-race) test run.
      - name: test (race)
        if: matrix.os != 'windows-latest'
        run: go test -race ./...
      # the fsutil concurrency test hangs on windows; fail in 3 minutes instead
      # of waiting out go test's 10 minute default
      - name: test
        if: matrix.os == 'windows-latest'
        run: go test -timeout 3m ./...
      - name: build
        run: go build ./...

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
      - name: govulncheck
        run: govulncheck ./...
